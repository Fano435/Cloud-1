global:
  scrape_interval: 60s
  external_labels:
    origin_prometheus: prometheus01

remote_write:
  - url: https://prometheus-prod-65-prod-eu-west-2.grafana.net/api/prom/push
    basic_auth:
      username_file: 
      password_file:

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']
  
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['localhost:8080']